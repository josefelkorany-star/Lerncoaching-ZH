name: PR5 – vollständig blockierte Transportdiagnose

on:
  push:
    branches: [codex/anfrage-transport-probe-20261117]

permissions:
  contents: read

jobs:
  readonly-probe:
    if: >-
      github.repository == 'josefelkorany-star/Lerncoaching-ZH' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/anfrage-transport-probe-20261117' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'CODEX RPC-DIAGNOSE READONLY 20261117 7F2A'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PROBE_PUBLIC_REPOSITORY: 'true'
      PROBE_REVIEW: 'approved-readonly'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install temporary pinned browser tools
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/inquiry-probe-browsers
          PROBE_DEPENDENCIES: ${{ runner.temp }}/inquiry-probe-tools
        run: |
          npm install --prefix "$PROBE_DEPENDENCIES" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.65.1
          node "$PROBE_DEPENDENCIES/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Observe SDK structure with all requests aborted
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/inquiry-probe-browsers
          PROBE_DEPENDENCIES: ${{ runner.temp }}/inquiry-probe-tools
        run: node _tests/inquiry-transport-probe.cjs
      # No artifacts, caches, retry, dispatch, production writes or secrets.
