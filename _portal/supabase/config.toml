# Isolated LOCAL test stack only. No cloud project reference or secrets.
project_id = "lerncoaching-portal-local-test"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = false
[inbucket]
enabled = false
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:4177"
additional_redirect_urls = []
jwt_expiry = 300
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
[auth.mfa]
max_enrolled_factors = 2
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[analytics]
enabled = false

# User-facing function: retain gateway verification in addition to its live SQL gate.
[functions.portal-accounts]
verify_jwt = true
